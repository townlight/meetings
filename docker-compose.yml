services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${TOWNLIGHT_MEETINGS_POSTGRES_USER:-townlight_meetings}
      POSTGRES_PASSWORD: ${TOWNLIGHT_MEETINGS_POSTGRES_PASSWORD:-townlight_meetings}
      POSTGRES_DB: ${TOWNLIGHT_MEETINGS_POSTGRES_DB:-townlight_meetings}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment: &townlight_meetings_env
      TOWNLIGHT_MEETINGS_STAFF_AUTH_MODE: ${TOWNLIGHT_MEETINGS_STAFF_AUTH_MODE:-protected}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_PROVIDER: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_PROVIDER:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_ISSUER: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_ISSUER:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_AUDIENCE: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_AUDIENCE:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_JWKS_URL: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_JWKS_URL:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_ROLE_CLAIMS: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_ROLE_CLAIMS:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_ALGORITHMS: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_ALGORITHMS:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_AUTHORIZATION_URL: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_AUTHORIZATION_URL:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_TOKEN_URL: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_TOKEN_URL:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_CLIENT_ID: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_CLIENT_ID:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_CLIENT_SECRET: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_CLIENT_SECRET:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_REDIRECT_URI: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_REDIRECT_URI:-}
      TOWNLIGHT_MEETINGS_STAFF_OIDC_SESSION_COOKIE_SECRET: ${TOWNLIGHT_MEETINGS_STAFF_OIDC_SESSION_COOKIE_SECRET:-}
      TOWNLIGHT_MEETINGS_STAFF_AUTH_TOKEN_ROLES: ${TOWNLIGHT_MEETINGS_STAFF_AUTH_TOKEN_ROLES:-}
      TOWNLIGHT_MEETINGS_STAFF_SSO_PRINCIPAL_HEADER: ${TOWNLIGHT_MEETINGS_STAFF_SSO_PRINCIPAL_HEADER:-}
      TOWNLIGHT_MEETINGS_STAFF_SSO_ROLES_HEADER: ${TOWNLIGHT_MEETINGS_STAFF_SSO_ROLES_HEADER:-}
      TOWNLIGHT_MEETINGS_STAFF_SSO_PROVIDER: ${TOWNLIGHT_MEETINGS_STAFF_SSO_PROVIDER:-}
      TOWNLIGHT_MEETINGS_STAFF_SSO_TRUSTED_PROXIES: ${TOWNLIGHT_MEETINGS_STAFF_SSO_TRUSTED_PROXIES:-}
      TOWNLIGHT_MEETINGS_AGENDA_INTAKE_DB_URL: postgresql+psycopg2://${TOWNLIGHT_MEETINGS_POSTGRES_USER:-townlight_meetings}:${TOWNLIGHT_MEETINGS_POSTGRES_PASSWORD:-townlight_meetings}@postgres:5432/${TOWNLIGHT_MEETINGS_POSTGRES_DB:-townlight_meetings}
      TOWNLIGHT_MEETINGS_AGENDA_ITEM_DB_URL: postgresql+psycopg2://${TOWNLIGHT_MEETINGS_POSTGRES_USER:-townlight_meetings}:${TOWNLIGHT_MEETINGS_POSTGRES_PASSWORD:-townlight_meetings}@postgres:5432/${TOWNLIGHT_MEETINGS_POSTGRES_DB:-townlight_meetings}
      TOWNLIGHT_MEETINGS_MEETING_BODY_DB_URL: postgresql+psycopg2://${TOWNLIGHT_MEETINGS_POSTGRES_USER:-townlight_meetings}:${TOWNLIGHT_MEETINGS_POSTGRES_PASSWORD:-townlight_meetings}@postgres:5432/${TOWNLIGHT_MEETINGS_POSTGRES_DB:-townlight_meetings}
      TOWNLIGHT_MEETINGS_MEETING_DB_URL: postgresql+psycopg2://${TOWNLIGHT_MEETINGS_POSTGRES_USER:-townlight_meetings}:${TOWNLIGHT_MEETINGS_POSTGRES_PASSWORD:-townlight_meetings}@postgres:5432/${TOWNLIGHT_MEETINGS_POSTGRES_DB:-townlight_meetings}
      TOWNLIGHT_MEETINGS_PACKET_ASSEMBLY_DB_URL: postgresql+psycopg2://${TOWNLIGHT_MEETINGS_POSTGRES_USER:-townlight_meetings}:${TOWNLIGHT_MEETINGS_POSTGRES_PASSWORD:-townlight_meetings}@postgres:5432/${TOWNLIGHT_MEETINGS_POSTGRES_DB:-townlight_meetings}
      TOWNLIGHT_MEETINGS_NOTICE_CHECKLIST_DB_URL: postgresql+psycopg2://${TOWNLIGHT_MEETINGS_POSTGRES_USER:-townlight_meetings}:${TOWNLIGHT_MEETINGS_POSTGRES_PASSWORD:-townlight_meetings}@postgres:5432/${TOWNLIGHT_MEETINGS_POSTGRES_DB:-townlight_meetings}
      TOWNLIGHT_MEETINGS_VENDOR_SYNC_DB_URL: postgresql+psycopg2://${TOWNLIGHT_MEETINGS_POSTGRES_USER:-townlight_meetings}:${TOWNLIGHT_MEETINGS_POSTGRES_PASSWORD:-townlight_meetings}@postgres:5432/${TOWNLIGHT_MEETINGS_POSTGRES_DB:-townlight_meetings}
      TOWNLIGHT_MEETINGS_EXPORT_ROOT: /data/exports
      TOWNLIGHT_MEETINGS_REDIS_URL: redis://redis:6379/0
      TOWNLIGHT_MEETINGS_OLLAMA_BASE_URL: http://ollama:11434
      TOWNLIGHT_CORE_LLM_PROVIDER: ollama
      TOWNLIGHT_MEETINGS_DEMO_SEED: ${TOWNLIGHT_MEETINGS_DEMO_SEED:-1}
      TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_ENABLED: ${TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_ENABLED:-false}
      TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_PAYLOAD_DIR: /data/connector-imports
      TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_LEDGER_PATH: ${TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_LEDGER_PATH:-/data/exports/connector-import-ledger.json}
      TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_CONNECTORS: ${TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_CONNECTORS:-}
      TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_INTERVAL_SECONDS: ${TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_INTERVAL_SECONDS:-900}
      TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_ENABLED: ${TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_ENABLED:-false}
      TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_SCHEDULE_ENABLED: ${TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_SCHEDULE_ENABLED:-false}
      TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_SOURCE_IDS: ${TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_SOURCE_IDS:-}
      TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_AUTH_SECRET_ENV: ${TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_AUTH_SECRET_ENV:-}
      TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_AUTH_SECRET_ENV_PREFIX: ${TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_AUTH_SECRET_ENV_PREFIX:-TOWNLIGHT_MEETINGS_VENDOR_SECRET_}
      TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_SHARED_SECRET: ${TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_SHARED_SECRET:-}
      TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_REPORT_DIR: ${TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_REPORT_DIR:-/data/exports/vendor-network-sync}
      TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_INTERVAL_SECONDS: ${TOWNLIGHT_MEETINGS_VENDOR_NETWORK_SYNC_INTERVAL_SECONDS:-900}
      TOWNLIGHT_CODE_INTAKE_URL: ${TOWNLIGHT_CODE_INTAKE_URL:-}
      TOWNLIGHT_CODE_INTAKE_SECRET: ${TOWNLIGHT_CODE_INTAKE_SECRET:-}
      TOWNLIGHT_CODE_INTAKE_ACTOR: ${TOWNLIGHT_CODE_INTAKE_ACTOR:-townlight_meetings-handoff@citycore.local}
    ports:
      - "${TOWNLIGHT_MEETINGS_API_PORT:-8776}:8776"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8776/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A townlight_meetings.worker worker --loglevel=info
    environment: *townlight_meetings_env
    volumes:
      - exports:/data/exports
      - ${TOWNLIGHT_MEETINGS_CONNECTOR_SYNC_PAYLOAD_DIR_HOST:-./connector-imports}:/data/connector-imports:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A townlight_meetings.worker inspect ping --destination celery@$$(hostname) >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A townlight_meetings.worker beat --loglevel=info
    environment: *townlight_meetings_env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${TOWNLIGHT_MEETINGS_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  ollamadata:
  exports:
